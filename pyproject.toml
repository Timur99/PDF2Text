[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2text-mcp"
version = "0.1.0"
description = "Local MCP server for PDF text extraction and image OCR with Apple Vision on macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "pydantic>=2.9",
  "pdf-inspector>=1.14",
  "pymupdf>=1.24",
]

[project.urls]
Homepage = "https://github.com/Timur99/PDF2Text"
Repository = "https://github.com/Timur99/PDF2Text"
Documentation = "https://github.com/Timur99/PDF2Text/blob/main/docs/MCP.md"
Issues = "https://github.com/Timur99/PDF2Text/issues"

[project.optional-dependencies]
# Preserve existing .[mcp,vision] installation commands.
mcp = []
ocr = [
  "paddlepaddle>=3.0",
  "paddleocr>=3.0",
]
# Apple Vision — встроенный в macOS OCR, только для macOS 13+
vision = [
  "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
local-ocr = "backend.main:run"
pdf2text = "backend.cli:run"
pdf2text-mcp = "backend.mcp_server:run"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
